packages:
  - api
  - web

# pnpm blocks dependency install scripts by default; only these may run.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  # Install-time usage analytics pulled in by swagger-ui-dist; not needed.
  '@scarf/scarf': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
